name: Build Bansify TWA APK & Play Store AAB

on:
  # Manual only: this workflow never runs on a push. Start it from
  # Actions -> "Build Bansify TWA APK & Play Store AAB" -> Run workflow
  # (or `gh workflow run build-twa.yml -R Bansify/accounts`).
  # Leave the version inputs empty for automatic numbering (code = run number,
  # name = 1.0.<run number>), or pin an explicit version name/code.
  # Every run publishes a GitHub Release tagged v<version name>.
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'Which Bansify app to package as TWA (accounts, mail, drive, meet, pay, ai, gitplus)'
        required: false
        default: 'accounts'
        type: choice
        options:
          - accounts
          - mail
          - drive
          - meet
          - pay
          - ai
          - gitplus
      version_name:
        description: 'App version name (e.g. 1.0.14) - empty = auto 1.0.<run number>'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Play Store integer version code (e.g. 14) - empty = run number'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-twa:
    name: Build Signed TWA (${{ inputs.app_slug || 'accounts' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: versioning
        run: |
          APP_SLUG="${{ inputs.app_slug || 'accounts' }}"

          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            V_NAME="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "app_slug=${APP_SLUG}" >> "$GITHUB_OUTPUT"
          echo "v_code=${V_CODE}" >> "$GITHUB_OUTPUT"
          echo "v_name=${V_NAME}" >> "$GITHUB_OUTPUT"
          echo "### Bansify TWA ${APP_SLUG} v${V_NAME} (code ${V_CODE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK Platforms 35/36 & Build-Tools
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > android.keystore
            KS_PASS="${KEYSTORE_PASS}"
            DETECTED_ALIAS=$(keytool -list -keystore android.keystore -storepass "$KS_PASS" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n 1 | cut -d',' -f1 | tr -d ' ' || true)
            K_ALIAS="${DETECTED_ALIAS:-${KEY_ALIAS:-bansify}}"
            K_PASS="${KEY_PASS:-$KS_PASS}"
          else
            KS_PASS="bansifyrelease123"
            K_ALIAS="bansify"
            K_PASS="bansifyrelease123"
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=Bansify, OU=Mobile, O=Bansify, L=Kanpur, ST=UP, C=IN"
          fi
          echo "KS_PASS=${KS_PASS}" >> "$GITHUB_ENV"
          echo "K_ALIAS=${K_ALIAS}" >> "$GITHUB_ENV"
          echo "K_PASS=${K_PASS}" >> "$GITHUB_ENV"
          echo "### Signing Key Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Alias**: \`${K_ALIAS}\`" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" | grep -i "SHA256:" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Generate TWA Android Project & Build Signed APK + AAB
        env:
          APP_SLUG: ${{ steps.versioning.outputs.app_slug }}
          VER_NAME: ${{ steps.versioning.outputs.v_name }}
          VER_CODE: ${{ steps.versioning.outputs.v_code }}
        run: |
          mkdir -p /tmp/twa-gen twa-build
          cp android.keystore twa-build/android.keystore
          npm --prefix /tmp/twa-gen install --no-audit --no-fund @bubblewrap/core
          NODE_PATH=/tmp/twa-gen/node_modules node -e '
            const fs = require("fs");
            const http = require("http");
            const path = require("path");
            const { TwaManifest, TwaGenerator } = require("@bubblewrap/core");

            (async () => {
              const slug = process.env.APP_SLUG || "accounts";
              const titles = {
                accounts: ["Bansify Accounts", "Accounts"],
                mail: ["Bansify Mail", "Mail"],
                drive: ["Bansify Drive", "Drive"],
                meet: ["Bansify Meet", "Meet"],
                pay: ["Bansify Pay", "Pay"],
                ai: ["Bansify AI", "Bansify AI"],
                gitplus: ["Bansify GitPlus", "GitPlus"]
              };
              const [fullName, shortName] = titles[slug] || ["Bansify Accounts", "Accounts"];
              const host = `${slug}.bansify.com`;

              const server = http.createServer((req, res) => {
                if (req.url.includes("manifest.json")) {
                  res.writeHead(200, { "Content-Type": "application/json" });
                  res.end(fs.readFileSync("web/manifest.json"));
                  return;
                }
                const file = req.url.includes("maskable")
                  ? "web/icon-512-maskable.png"
                  : "web/icon-512.png";
                res.writeHead(200, { "Content-Type": "image/png" });
                res.end(fs.readFileSync(file));
              });
              await new Promise((r) => server.listen(0, "127.0.0.1", r));
              const port = server.address().port;

              const base = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
              base.packageId = `com.bansify.${slug}`;
              base.host = host;
              base.name = fullName;
              base.launcherName = shortName;
              base.iconUrl = `http://127.0.0.1:${port}/icon-512.png`;
              base.maskableIconUrl = `http://127.0.0.1:${port}/icon-512-maskable.png`;
              base.webManifestUrl = `http://127.0.0.1:${port}/manifest.json`;
              base.fullScopeUrl = `https://${host}/`;
              base.appVersion = process.env.VER_NAME || "1.0.0";
              base.appVersionName = process.env.VER_NAME || "1.0.0";
              base.appVersionCode = Number(process.env.VER_CODE || 1);
              base.minSdkVersion = 24;
              base.signingKey = { path: "./android.keystore", alias: process.env.K_ALIAS || "bansify" };

              const manifest = new TwaManifest(base);
              const generator = new TwaGenerator();
              await generator.createTwaProject(path.resolve("twa-build"), manifest);

              let rootGradle = fs.readFileSync("twa-build/build.gradle", "utf8");
              rootGradle = rootGradle.replace(/jcenter\(\)/g, "mavenCentral()");
              fs.writeFileSync("twa-build/build.gradle", rootGradle);

              let gradle = fs.readFileSync("twa-build/app/build.gradle", "utf8");
              gradle = gradle
                .replace(/targetSdkVersion\s+\d+/, "targetSdkVersion 35")
                .replace(/http:\/\/127\.0\.0\.1:\d+\/manifest\.json/g, `https://${host}/manifest.json`)
                .replace(
                  /buildTypes\s*\{\s*release\s*\{\s*minifyEnabled\s+true\s*\}\s*\}/,
                  `signingConfigs {\n        release {\n            storeFile file("../android.keystore")\n            storePassword System.getenv("KS_PASS")\n            keyAlias System.getenv("K_ALIAS")\n            keyPassword System.getenv("K_PASS")\n            enableV1Signing true\n            enableV2Signing true\n            enableV3Signing true\n        }\n    }\n    buildTypes {\n        release {\n            minifyEnabled true\n            signingConfig signingConfigs.release\n        }\n    }`
                );
              fs.writeFileSync("twa-build/app/build.gradle", gradle);
              process.exit(0);
            })().catch((err) => {
              console.error("::error title=Bubblewrap::" + (err && err.stack ? err.stack.replace(/\n/g, " | ") : err));
              process.exit(1);
            });
          '
          cd twa-build
          chmod +x gradlew
          if ! ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace > gradle.log 2>&1; then
            ERR_SUMMARY=$(grep -E "FAILURE:|What went wrong:|^\* |Exception|Error" gradle.log | tail -n 15 | tr '\n' ' ')
            echo "::error title=Gradle::${ERR_SUMMARY}"
            cat gradle.log
            exit 1
          fi
          APK_OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_OUT=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          mkdir -p ../release_out
          cp "$APK_OUT" "../release_out/bansify-${APP_SLUG}-v${VER_NAME}-release.apk"
          cp "$AAB_OUT" "../release_out/bansify-${APP_SLUG}-v${VER_NAME}-playstore.aab"
          ls -lh ../release_out

      - name: Write checksums
        run: |
          cd release_out
          sha256sum bansify-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Signed APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bansify-${{ steps.versioning.outputs.app_slug }}-v${{ steps.versioning.outputs.v_name }}-twa-release
          path: release_out/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_out/bansify-${{ steps.versioning.outputs.app_slug }}-v${{ steps.versioning.outputs.v_name }}-release.apk
            release_out/bansify-${{ steps.versioning.outputs.app_slug }}-v${{ steps.versioning.outputs.v_name }}-playstore.aab
            release_out/SHA256SUMS.txt
