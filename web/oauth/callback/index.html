<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Return to Bansify Accounts</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/legacy/variables.css" />
  <link rel="stylesheet" href="/css/legacy/base.css" />
  <link rel="stylesheet" href="/css/legacy/components.css" />
  <link rel="stylesheet" href="/css/legacy/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-container-modern" style="max-width:440px;margin:40px auto;padding:20px;text-align:center;">
      <div class="auth-header-card">
        <img src="/icon-192-maskable.png" alt="Bansify Accounts" width="56" height="56" />
        <h1 class="auth-header-title" id="oauth-callback-title">Returning to Bansify Accounts</h1>
        <p id="oauth-callback-message" role="status">Completing sign-in in your Android app…</p>
      </div>
      <p style="margin:20px 0;">
        <a class="btn btn-primary" id="oauth-open-app" href="/me" style="display:inline-block;text-decoration:none;">
          Open Bansify Accounts App
        </a>
      </p>
      <p><a href="/me">Continue on the web instead</a></p>
    </div>
  </main>
  <script type="module" src="/oauth/callback/callback.js"></script>
</body>
</html>
